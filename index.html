<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmPACT Lab Members Weekly Schedule</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <section>
      <h1>EmPACT Lab Members Schedule</h1>
    </section>

    <div class="layout">
      <aside class="filters">
        <div class="filters-header">
          <h2>People</h2>
          <button class="select-all" id="selectAllButton" type="button">Select All</button>
        </div>
        <input class="people-search" id="peopleSearch" type="text" placeholder="Search people">
        <div class="person-list" id="personFilters">
          <p class="filter-empty">No people added yet. Send me the schedules and I will populate them.</p>
        </div>
      </aside>

      <section class="table-wrap">
        <div class="planner-grid" id="timetable"></div>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
